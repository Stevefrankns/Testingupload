            <div className="flex flex-col items-center"><Clock className="w-8 h-8 text-blue-600 mb-2" /><h4 className="font-bold text-slate-800">24/7 Availability</h4><p className="text-sm text-slate-500">Emergency dispatch</p></div>
            <div className="flex flex-col items-center"><ShieldCheck className="w-8 h-8 text-blue-600 mb-2" /><h4 className="font-bold text-slate-800">Fully Licensed</h4><p className="text-sm text-slate-500">Insured {CITY} Techs</p></div>
            <div className="flex flex-col items-center"><Wrench className="w-8 h-8 text-blue-600 mb-2" /><h4 className="font-bold text-slate-800">All Brands</h4><p className="text-sm text-slate-500">Repair & Installation</p></div>
            <div className="flex flex-col items-center"><CheckCircle2 className="w-8 h-8 text-blue-600 mb-2" /><h4 className="font-bold text-slate-800">100% Guarantee</h4><p className="text-sm text-slate-500">Satisfaction promised</p></div>
          </div>
        </div>

        {/* Dynamic Warning Signs / Intent Matching (SEO focus) */}
        <section className="bg-amber-50 py-12 border-b border-amber-100">
          <div className="max-w-7xl mx-auto px-4 text-center">
             <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-4 flex items-center justify-center">
                <Search className="w-6 h-6 mr-3 text-amber-600" /> Are You Experiencing Any of These Symptoms?
             </h2>
             <p className="text-slate-700 mb-8 max-w-2xl mx-auto">Don't wait for a complete system breakdown. If your home in {CITY} is showing these warning signs, our diagnostic teams can resolve them today.</p>
             <div className="flex flex-wrap justify-center gap-3">
               {[
                 "ac blowing hot air intermittently", "furnace short cycling", "water pooling around ac unit", 
                 "thermostat screen blank", "ac breaker keeps tripping", "hot and cold spots in house",
                 "hvac smells musty (dirty sock syndrome)", "sudden loss of airflow across entire house"
               ].map(symptom => (
                 <span key={symptom} className="bg-white border border-amber-200 text-amber-800 text-sm font-semibold px-4 py-2 rounded-full shadow-sm capitalize">
                    {symptom}
                 </span>
               ))}
             </div>
          </div>
        </section>

        {/* Category Grid */}
        <section className="py-20 bg-slate-50">
          <div className="max-w-7xl mx-auto px-4">
            <div className="text-center mb-16">
              <h2 className="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4">Comprehensive HVAC Services in {CITY}</h2>
              <p className="text-lg text-slate-600 max-w-3xl mx-auto">We don't just treat symptoms; we diagnose the root cause. Select a category below to explore our specialized performance, repair, and installation services.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              {Object.keys(rawSitemap).map((categoryName, idx) => {
                const slug = getCategorySlug(categoryName);
                let Icon = Settings;
                if (categoryName.includes('Conditioning') || categoryName.includes('Cooling')) Icon = Thermometer;
                if (categoryName.includes('Heating') || categoryName.includes('Furnace') || categoryName.includes('Boiler')) Icon = Zap;
                if (categoryName.includes('Airflow') || categoryName.includes('Duct') || categoryName.includes('Quality')) Icon = Wind;
                if (categoryName.includes('Condensate') || categoryName.includes('Moisture')) Icon = Droplets;
                if (categoryName.includes('Emergency')) Icon = AlertTriangle;

                return (
                  <div key={idx} className="bg-white rounded-xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-blue-300 transition-all cursor-pointer flex flex-col h-full group" onClick={() => navigate(slug)}>
                    <div className="p-8 flex-grow">
                      <div className="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mb-6 group-hover:bg-blue-600 transition-colors">
                        <Icon className="w-8 h-8 text-blue-600 group-hover:text-white transition-colors" />
                      </div>
                      <h3 className="text-xl font-bold text-slate-900 mb-3">{categoryName}</h3>
                      <p className="text-slate-500 mb-6 line-clamp-3">Expert {categoryName.toLowerCase()} tailored for {CITY} residential and commercial properties.</p>
                    </div>
                    <div className="px-8 py-4 border-t border-slate-100 text-blue-600 font-semibold flex items-center justify-between group-hover:bg-blue-50 transition-colors rounded-b-xl">
                      View Services <ChevronRight className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>

        {/* Content Section */}
        <section className="py-20 bg-white border-t border-slate-200">
          <div className="max-w-4xl mx-auto px-4 prose prose-lg text-slate-600">
            <h2 className="text-3xl font-bold text-slate-900 mb-6 text-center">Why Rely on {CITY} Climate Pros?</h2>
            <p>When your environment is uncomfortable, you need more than just a quick fix. You need a comprehensive diagnostic approach. Our structured service methodology ensures that whether you are dealing with uneven heating, weak AC airflow, or a complete system breakdown without warning, we address the underlying performance issues—not just the surface symptoms.</p>
            <p>Operating locally in <strong>{CITY}, {STATE}</strong>, our technicians are trained across all major brands and system types. From specialized micro-services like <em>Mastic Duct Sealing</em> and <em>Secondary Attic Drain Pan Installations</em> to complete <em>Geothermal Ground Loop Flushing</em>, we pride ourselves on transparent pricing, precise calibration, and restoring your indoor climate rapidly.</p>
          </div>
        </section>
      </div>
    );

    const CategoryPage = ({ categoryName, childrenSlugs, navigate }) => {
      // Pull symptoms dynamically to avoid thin content
      const symptomsList = symptomKeywords[categoryName] || symptomKeywords["General"];

      return (
        <div className="pb-20">
          <div className="bg-slate-900 text-white py-16">
            <div className="max-w-7xl mx-auto px-4">
              <h1 className="text-4xl md:text-5xl font-extrabold mb-4">{categoryName} in {CITY}, {STATE}</h1>
              <p className="text-xl text-slate-300 max-w-3xl">Comprehensive diagnostic, repair, maintenance, and optimization services. Select from our specialized sub-services below.</p>
            </div>
          </div>
          
          <div className="max-w-7xl mx-auto px-4 mt-12 grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div className="lg:col-span-2">
              
              {/* Added Symptom Block for SEO Richness */}
              {symptomsList && symptomsList.length > 0 && (
                <div className="bg-red-50 border border-red-100 p-6 rounded-lg mb-10">
                  <h3 className="text-lg font-bold text-red-900 mb-3 flex items-center">
                    <AlertTriangle className="w-5 h-5 mr-2 text-red-600"/> Common Warning Signs We Resolve
                  </h3>
                  <p className="text-sm text-red-800 mb-4">If you are currently experiencing any of the following issues, please contact us immediately to prevent further system damage:</p>
                  <ul className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {symptomsList.map((sym, i) => (
                      <li key={i} className="flex items-start text-sm text-red-800">
                        <span className="text-red-500 mr-2">•</span> <span className="capitalize">{sym}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              <h2 className="text-2xl font-bold text-slate-800 mb-6 border-b border-slate-200 pb-2">Available Sub-Services</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {childrenSlugs.map(slug => (
                  <button key={slug} onClick={() => navigate(slug)} className="text-left bg-white border border-slate-200 p-4 rounded-lg shadow-sm hover:shadow-md hover:border-blue-400 transition flex items-center group">
                    <div className="w-2 h-2 bg-blue-500 rounded-full mr-3 group-hover:scale-150 transition-transform"></div>
                    <span className="font-medium text-slate-700 group-hover:text-blue-700 transition-colors">{formatTitleFromSlug(slug)}</span>
                  </button>
                ))}
              </div>
            </div>
            
            <div className="lg:col-span-1">
              <div className="sticky top-28 bg-blue-50 rounded-xl p-8 border border-blue-100 shadow-sm">
                <h3 className="text-xl font-bold text-slate-900 mb-4">Need {categoryName} Now?</h3>
                <p className="text-slate-600 mb-6 text-sm">Our dispatch team is standing by in {CITY}. We can diagnose and fix your issue today.</p>
                <a href={`tel:${PHONE}`} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow flex items-center justify-center transition-colors mb-4 text-lg"><Phone className="w-5 h-5 mr-2" /> Call {PHONE}</a>
                <div className="flex items-center justify-center my-4"><div className="h-px bg-blue-200 w-full"></div><span className="px-3 text-blue-400 text-sm font-medium uppercase">OR</span><div className="h-px bg-blue-200 w-full"></div></div>
                <button className="w-full bg-white border-2 border-orange-500 text-orange-600 hover:bg-orange-50 font-bold py-3 rounded-lg transition-colors">Request Online Quote</button>
                <ul className="mt-6 space-y-2 text-sm text-slate-600">
                  <li className="flex items-center"><CheckCircle2 className="w-4 h-4 text-green-500 mr-2" /> Local {CITY} Technicians</li>
                  <li className="flex items-center"><CheckCircle2 className="w-4 h-4 text-green-500 mr-2" /> Upfront, Honest Pricing</li>
                  <li className="flex items-center"><CheckCircle2 className="w-4 h-4 text-green-500 mr-2" /> Parts & Labor Warranties</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ServicePage = ({ serviceSlug, categoryName }) => {
      const serviceTitle = formatTitleFromSlug(serviceSlug);
      
      // Pull random symptoms related to the parent category to enrich the leaf page content dynamically
      const pageSymptoms = useMemo(() => getRandomSymptoms(categoryName, 3), [categoryName]);

      return (
        <div className="pb-20">
          <div className="bg-slate-800 text-white py-12 md:py-20 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
              <div className="w-full h-full" style={{backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '32px 32px'}}></div>
            </div>
            <div className="max-w-7xl mx-auto px-4 relative z-10">
              <div className="inline-block bg-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4">{categoryName}</div>
              <h1 className="text-3xl md:text-5xl font-extrabold mb-4 leading-tight">{serviceTitle} in {CITY}, {STATE}</h1>
              <p className="text-lg text-slate-300 max-w-2xl">Professional, fast, and guaranteed <strong>{serviceTitle.toLowerCase()}</strong>. Stop struggling with poor performance—let our certified {CITY} technicians diagnose and resolve the issue permanently.</p>
            </div>
          </div>
          
          <div className="max-w-7xl mx-auto px-4 mt-12 grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div className="lg:col-span-2 space-y-10 text-slate-700">
              
              <section className="prose prose-blue max-w-none">
                <h2 className="text-2xl font-bold text-slate-900 border-b border-slate-200 pb-2">Overview of {serviceTitle}</h2>
                <p>When you require <strong>{serviceTitle.toLowerCase()}</strong>, waiting can often lead to more severe system damage. In {CITY}, the climate demands that your HVAC system operates at peak efficiency year-round. Our specialized process isolates the exact component failure or structural imbalance.</p>
                <p>If you have recently noticed that your <strong>{pageSymptoms[0]}</strong> or perhaps <strong>{pageSymptoms[1]}</strong>, these are strong indicators that intervention is needed. Rather than applying a temporary patch, our diagnostic team utilizes advanced measurement tools to evaluate electrical loads, refrigerant pressures, and static airflow. This ensures that our <em>{serviceTitle.toLowerCase()}</em> restores the entire unit to manufacturer specifications.</p>
              </section>

              <section className="bg-slate-50 p-6 md:p-8 rounded-xl border border-slate-100">
                <h3 className="text-xl font-bold text-slate-900 mb-4">Our {CITY} Service Process</h3>
                <ul className="space-y-4">
                  <li className="flex"><div className="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold mr-4">1</div><div><h4 className="font-bold text-slate-900">Comprehensive Assessment</h4><p className="text-sm text-slate-600 mt-1">We thoroughly test all related sub-systems (including checking if <em>{pageSymptoms[2]}</em>) before recommending a fix.</p></div></li>
                  <li className="flex"><div className="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold mr-4">2</div><div><h4 className="font-bold text-slate-900">Transparent Quote</h4><p className="text-sm text-slate-600 mt-1">You receive a flat-rate estimate with no hidden fees.</p></div></li>
                  <li className="flex"><div className="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold mr-4">3</div><div><h4 className="font-bold text-slate-900">Precision Execution & Testing</h4><p className="text-sm text-slate-600 mt-1">We recalibrate the system and run a full cycle test to verify optimal performance.</p></div></li>
                </ul>
              </section>

              {/* Dynamic FAQ section to absorb long-tail keywords */}
              <section className="prose prose-blue max-w-none">
                <h2 className="text-2xl font-bold text-slate-900 border-b border-slate-200 pb-2">Frequently Asked Questions</h2>
                <div className="space-y-6 mt-6">
                  <div>
                    <h4 className="font-bold text-lg text-slate-800 m-0">Does {serviceTitle.toLowerCase()} fix issues like {pageSymptoms[0]}?</h4>
                    <p className="mt-1 text-slate-600">Yes, in many cases, this specific service directly targets the underlying mechanical or airflow faults that cause those exact symptoms in your home.</p>
                  </div>
                  <div>
                    <h4 className="font-bold text-lg text-slate-800 m-0">Do you offer emergency dispatch in {CITY}?</h4>
                    <p className="mt-1 text-slate-600">Yes, we understand that HVAC failures don't happen on a schedule. We offer rapid dispatch throughout the {CITY} metro area for urgent situations, particularly during extreme heatwaves or freezing weather.</p>
                  </div>
                </div>
              </section>

            </div>
            
            <div className="lg:col-span-1">
              <div className="sticky top-28 bg-white rounded-2xl shadow-xl border border-slate-200 p-6">
                <div className="text-center mb-6">
                  <h3 className="text-xl font-bold text-slate-900">Schedule This Service</h3>
                  <p className="text-sm text-slate-500 mt-1">Get an estimate for {serviceTitle}</p>
                </div>
                <form className="space-y-4" onSubmit={(e) => e.preventDefault()}>
                  <div><label className="block text-xs font-bold text-slate-700 uppercase mb-1">Full Name</label><input type="text" className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" /></div>
                  <div><label className="block text-xs font-bold text-slate-700 uppercase mb-1">Phone Number</label><input type="tel" className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" /></div>
                  <div><label className="block text-xs font-bold text-slate-700 uppercase mb-1">Service Needed</label><input type="text" readOnly value={serviceTitle} className="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-lg text-slate-500 font-medium cursor-not-allowed" /></div>
                  <button className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-lg shadow transition-transform transform hover:-translate-y-0.5 mt-4">Request Service</button>
                </form>
                <div className="mt-6 pt-6 border-t border-slate-100 text-center">
                  <p className="text-sm text-slate-500 mb-2">Prefer to talk?</p>
                  <a href={`tel:${PHONE}`} className="inline-flex items-center text-xl font-extrabold text-blue-600 hover:text-blue-800 transition"><Phone className="w-5 h-5 mr-2" /> {PHONE}</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      // Safe path initialization for iframe/blob environments
      const getInitialPath = () => {
        const path = window.location.pathname;
        if (path === '/' || path === '/hvac-services/') return path;
        
        let isValid = false;
        for (const [catName, slugs] of Object.entries(rawSitemap)) {
          if (getCategorySlug(catName) === path || slugs.includes(path)) {
            isValid = true;
            break;
          }
        }
        return isValid ? path : '/';
      };

      // Initialize state using the actual browser path to handle direct linking
      const [currentPath, setCurrentPath] = useState(getInitialPath());

      // Listen for browser back/forward buttons and sync state
      useEffect(() => {
        const handlePopState = () => {
          setCurrentPath(getInitialPath());
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      // Custom navigate function that updates internal state AND the browser URL bar
      const navigatePath = (path) => {
        try {
          window.history.pushState({}, '', path);
        } catch (err) {
          // Gracefully handle iframe/blob security restrictions
          console.warn("History API blocked in this environment. State updated internally.");
        }
        setCurrentPath(path);
      };

      // Always scroll to the top of the page after a route change
      useEffect(() => {
        window.scrollTo(0, 0);
      }, [currentPath]);

      const routeEngine = useMemo(() => {
        if (currentPath === '/' || currentPath === '/hvac-services/') {
          return <HomePage navigate={navigatePath} />;
        }

        let matchedCategoryName = null;
        let matchedCategoryChildren = null;
        for (const [catName, slugs] of Object.entries(rawSitemap)) {
          const catPath = getCategorySlug(catName);
          if (currentPath === catPath) {
            matchedCategoryName = catName;
            matchedCategoryChildren = slugs;
            break;
          }
        }
        if (matchedCategoryName) return <CategoryPage categoryName={matchedCategoryName} childrenSlugs={matchedCategoryChildren} navigate={navigatePath} />;

        let matchedServiceSlug = null;
        let parentCategoryName = null;
        for (const [catName, slugs] of Object.entries(rawSitemap)) {
          if (slugs.includes(currentPath)) {
            matchedServiceSlug = currentPath;
            parentCategoryName = catName;
            break;
          }
        }
        if (matchedServiceSlug) return <ServicePage serviceSlug={matchedServiceSlug} categoryName={parentCategoryName} />;

        return (
          <div className="py-32 text-center">
            <AlertTriangle className="w-16 h-16 text-orange-500 mx-auto mb-4" />
            <h2 className="text-3xl font-bold text-slate-900 mb-2">Page Not Found</h2>
            <button onClick={() => navigatePath('/')} className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold">Return Home</button>
          </div>
        );
      }, [currentPath]);

      return (
        <Layout currentPath={currentPath} navigate={navigatePath}>
          <Breadcrumbs path={currentPath} navigate={navigatePath} />
          {routeEngine}
        </Layout>
      );
    }

    // Render the app directly to the DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
